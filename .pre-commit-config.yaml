exclude: '.idea/|.vscode/|bugs/|dev/'
minimum_pre_commit_version: 4.5.1
default_language_version:
  python: '3.14'
  node: '24.13.0'
repos:
  # https://pre-commit.com/hooks.html
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        name: ruff isort
        files: '^src/|^tests/'
        args: [ "--select", "I", "--fix" ]
      - id: ruff-format
        files: '^src/|^tests/'
      - id: ruff-check
        files: '^src/|^tests/'
  # uv
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.0
    hooks:
      - id: uv-lock
      - id: uv-export
        args: ["--no-dev", "--no-hashes", "--frozen", "--output-file=requirements.txt"]
      - id: uv-export
        args: [ "--no-dev", "--frozen", "--output-file=pylock.toml" ]
  # tach
  - repo: local
    hooks:
      - id: tach
        name: tach
        description: "Check that the pyproject.toml and setup.cfg versions match."
        entry: "tach check"
        pass_filenames: false
        language: system
  # nbstripout-fast
  - repo: https://github.com/deshaw/nbstripout-fast.git
    rev: v1.1.2
    hooks:
      - id: nbstripout-fast
        exclude: '^docs/|^experiments/'
  # personal hooks
  - repo: https://github.com/randolf-scholz/assorted-hooks.git
    rev: v0.7.19
    hooks:
      # pygrep hooks
      - id: check-separator-length-88
      - id: pyarrow-timestamp-seconds
      - id: numpy-rename-axes-axis
      - id: python-consider-using-raw-string
      - id: python-system-exit
      - id: python-match-case-builtins
      - id: python-double-comment
      # ast-based hooks
      - id: check-direct-imports
      - id: check-dunder-all
        files: '^src/'
      - id: check-signatures
        files: '^src/'
        exclude: 'functional.py|matrix_tests.py'
        args:
          - "--max-positional-args"
          - "4"
          - "--ignore-names"
          - "forward"
          - "backward"
          - "--"
      # script-based hooks
      - id: check-clean-interface
        files: '^src/'
        exclude: '^tests/|/tests/'
      - id: update-requirements
      - id: check-requirements-valid
      - id: check-requirements-maintained
      - id: check-requirements-used
      # other hooks
      - id: check-archived-hooks
      - id: check-resolved-github-issues
        files: '^src/|^tests/'
  - repo: local
    hooks:
      - id: unknown-inline-pragma
        name: unknown-inline-pragma
        description: "Check for unknown inline pragmas."
        language: pygrep
        entry: '(?x)
          ^[^\n]*\S[^\n]*\#\x20+
          (?!
            type
            |pyright
            |pyrefly
            |ty
            |noqa
            |fmt
            |shape
            |mypy
            |ruff
            |FIXME
            |SEE
            |NOTE
            |TODO
            |REF
            |see
            |ref
            |note
          )\w+:
          [^\n]+$'
        types: [ python ]
        files: '^src/|^tests/'
  # markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args:
          - "--disable" # disable rules
          - "MD013"     # Line length
          - "MD033"     # Inline HTML
          - "MD010"     # Hard tabs
          - "--"        # otherwise files are interpreted as args
  # shellcheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "--shell=bash", "--color=always", "--format=gcc", "--"]
  # pyright
  - repo: https://github.com/randolf-scholz/assorted-hooks.git
    rev: v0.7.19
    hooks:
      - id: pyright-concise
        files: '^src/|^tests/'
        # exclude: 'src/linodenet/parametrizations/'
  # mypy
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        require_serial: true
        types_or: [python, pyi]
        files: '^src/|^tests/'
        # exclude: '/parametrizations/'
        entry: mypy
        args:
          - "--hide-error-context"
          - "--hide-error-end"
          - "--no-pretty"
          - "--show-traceback"
          - "--"
